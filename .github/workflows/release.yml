name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  KEYRING: fossc-archive-keyring.asc

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run goreleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # goreleaser deprecated `brews` (formulas) in favor of casks; fossc is a
      # pure CLI, so we generate the real formula from the release checksums.
      - name: Push Homebrew formula
        env:
          GH_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: |
          chmod +x scripts/build-formula.sh
          scripts/build-formula.sh "${GITHUB_REF_NAME#v}" dist/checksums.txt

      # ---- self-hosted apt repo on GitHub Pages ----
      # Done in this same workflow: releases authored with GITHUB_TOKEN do not
      # trigger other workflows.
      - name: Install aptly
        run: |
          sudo mkdir -p /etc/apt/keyrings
          sudo wget -qO /etc/apt/keyrings/aptly.asc https://www.aptly.info/pubkey.txt
          echo "deb [signed-by=/etc/apt/keyrings/aptly.asc] https://repo.aptly.info/release noble main" | sudo tee /etc/apt/sources.list.d/aptly.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq aptly

      - name: Import apt signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          gpg --list-secret-keys --keyid-format long

      - name: Publish apt repo
        env:
          GH_TOKEN: ${{ github.token }}
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Every release's .debs, so published versions stay installable.
          mkdir -p debs
          for rel in $(gh release list -R "$GITHUB_REPOSITORY" --limit 50 --json tagName -q '.[].tagName'); do
            gh release download "$rel" -R "$GITHUB_REPOSITORY" --pattern '*.deb' --dir debs
          done

          aptly repo create -distribution=stable -component=main fossc-stable
          aptly repo add fossc-stable debs/*.deb
          aptly snapshot create "fossc-${VERSION#v}" from repo fossc-stable
          aptly publish snapshot -gpg-key="$GPG_KEY_ID" -force-overwrite \
            -distribution=stable "fossc-${VERSION#v}"
          cp "packaging/apt/$KEYRING" public/

      - name: Deploy apt repo to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ github.token }}
          publish_branch: gh-pages
          publish_dir: public
          keep_files: true
          force_orphan: false
